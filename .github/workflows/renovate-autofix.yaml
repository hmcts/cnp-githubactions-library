name: Renovate Autofix

on:
  workflow_call:
    inputs:
      prompt:
        description: "Instructions for Claude. Appended to a generated context block naming the repo, PR, branch, update and failed jobs. Put repository conventions here — the toolchain, what a valid fix looks like, what to leave alone."
        required: true
        type: string
      ci-workflow:
        description: "Filename of the workflow whose failure is being diagnosed, e.g. workflow.preview.yml. Used to find the latest failed run when dispatched manually. Required when ci-system is github-actions, and unused in jenkins mode, where there is no workflow to name."
        required: false
        type: string
        default: ''
      ci-system:
        description: "Which CI reported the failure: 'github-actions', driven by a workflow_run event, or 'jenkins', driven by a status event. Selected explicitly rather than inferred from the event, so a caller that triggers on both cannot switch mode by accident, and so a manual run — which carries no event to infer from — needs no second rule."
        required: false
        type: string
        default: github-actions
      jenkins-url:
        description: "Root URL of the Jenkins controller, used in jenkins mode. A build is only fetched when the status event's target_url sits under this, so a commit status written by something else cannot point the credentials at a host of its choosing."
        required: false
        type: string
        default: 'https://build.hmcts.net'
      jenkins-status-context:
        description: "Commit status context Jenkins reports the build under. Every other context — SonarCloud, other integrations, another Jenkins job — is ignored."
        required: false
        type: string
        default: 'continuous-integration/jenkins/pr-head'
      pr-number:
        description: "PR to attempt, for manual runs. Leave unset when triggered by workflow_run — the PR is resolved from the event."
        required: false
        type: string
        default: ''
      jenkins-build-url:
        description: "Jenkins build to diagnose, for manual runs in jenkins mode. Required there because a manual run carries no status event to take the build from, and reading the commit statuses instead would need a statuses: read scope that existing callers do not grant."
        required: false
        type: string
        default: ''
      base-branch:
        description: "Only attempt PRs targeting this branch."
        required: false
        type: string
        default: master
      renovate-author:
        description: "Login of the bot whose PRs are eligible. Matched against the REST author, not the branch prefix."
        required: false
        type: string
        default: 'renovate[bot]'
      allowed-bots:
        description: "Passed to claude-code-action as allowed_bots, which otherwise refuses a non-human triggering actor. Note this is the bot's short name, not the PR author login. In jenkins mode the triggering actor is the Jenkins App that wrote the commit status, not Renovate, so this has to name that instead — 'hmcts-jenkins-d-to-i' for the d_to_i folder."
        required: false
        type: string
        default: renovate
      attempt-label:
        description: "Label claimed before Claude runs, to cap this at one attempt per PR. Remove it from a PR to allow another."
        required: false
        type: string
        default: 'claude:autofix-attempted'
      skip-when-all-failures-match:
        description: "Regex. When every failed job name matches it, the run is skipped. Use for failures no code change can fix — a deploy against an environment that is switched off, say. In jenkins mode it matches failed pipeline stage names instead, which are the nearest equivalent."
        required: false
        type: string
        default: ''
      node-version-file:
        description: "Passed to actions/setup-node. Set to an empty string to skip Node setup entirely."
        required: false
        type: string
        default: .nvmrc
      cache:
        description: "Passed to actions/setup-node as cache. Empty string disables caching."
        required: false
        type: string
        default: yarn
      cache-dependency-path:
        description: "Passed to actions/setup-node as cache-dependency-path."
        required: false
        type: string
        default: '**/yarn.lock'
      enable-corepack:
        description: "Run corepack enable before Node setup, for repos pinning a packageManager."
        required: false
        type: boolean
        default: true
      max-turns:
        description: "Turn limit for the agent. A stop here lands as no-change and is reported as an incomplete attempt."
        required: false
        type: number
        default: 40
      allowed-tools:
        description: "Claude Code --allowedTools value. The default enumerates git subcommands rather than allowing Bash(git:*). Note the run also passes --dangerously-skip-permissions, which skips permission prompts, so treat this as documenting the intended tool surface rather than as an enforced restriction."
        required: false
        type: string
        default: 'Read,Glob,Grep,Write,Edit,Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(git ls-files:*),Bash(git config user.name:*),Bash(git config user.email:*)'
      extra-allowed-tools:
        description: "Appended to allowed-tools. Use this for the build tooling a fix needs, e.g. Bash(corepack:*),Bash(yarn:*)."
        required: false
        type: string
        default: ''
      commit-author-name:
        description: "Author name on the fix commit."
        required: false
        type: string
        default: 'claude-code-bot[bot]'
      commit-author-email:
        description: "Author email on the fix commit."
        required: false
        type: string
        default: 'claude-code-bot[bot]@users.noreply.github.com'
      aws-role:
        description: "Role assumed for Bedrock access."
        required: false
        type: string
        default: 'arn:aws:iam::313941174580:role/HMCTSClaudeGitHubActionsRole'
      aws-region:
        description: "Region for Bedrock."
        required: false
        type: string
        default: eu-west-1
      opus-model:
        description: "Bedrock model id for Opus."
        required: false
        type: string
        default: 'eu.anthropic.claude-opus-5'
      sonnet-model:
        description: "Bedrock model id for Sonnet."
        required: false
        type: string
        default: 'eu.anthropic.claude-sonnet-5'
      haiku-model:
        description: "Bedrock model id for Haiku."
        required: false
        type: string
        default: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
      runs-on:
        description: "Runner label for both jobs."
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_APP_ID:
        description: "App id of the GitHub App that commits and comments."
        required: true
      CLAUDE_CODE_PRIVATE_KEY:
        description: "Private key for that App."
        required: true
      JENKINS_USERNAME:
        description: "Jenkins user the build and its console log are read as, in jenkins mode. Optional at workflow_call validation time so `secrets: inherit` keeps working on repos that do not use jenkins mode; the eligibility gate declines when the mode is selected without it."
        required: false
      JENKINS_API_TOKEN:
        description: "API token for that user, from its Jenkins user configuration page — not its password. Same optionality as above. It reaches curl through a 0600 config file rather than the command line, and that file is removed before Claude starts."
        required: false
    outputs:
      pr-number:
        description: "PR that was resolved, whether or not it was attempted."
        value: ${{ jobs.resolve.outputs.number }}
      eligible:
        description: "Whether the gate allowed an attempt."
        value: ${{ jobs.resolve.outputs.eligible }}
      outcome:
        description: "fixed, no-change, rewritten or dirty. Empty when no attempt was made."
        value: ${{ jobs.autofix.outputs.outcome }}
      pushed:
        description: "true only when a commit reached the branch."
        value: ${{ jobs.autofix.outputs.pushed }}

jobs:
  resolve:
    name: Check Eligibility
    runs-on: ${{ inputs.runs-on }}
    concurrency:
      # Serialised with the claim below, so two failures arriving together cannot both
      # read the label as absent and both go on to run the agent. Keyed on the branch
      # rather than the PR number, which is not known until this job runs. A status
      # event names the branch in `branches`, whose first entry is the branch whose
      # head the status is on.
      group: renovate-autofix-${{ github.repository }}-${{ github.event.workflow_run.head_branch || github.event.branches[0].name || inputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      number: ${{ steps.pr.outputs.number }}
      head-ref: ${{ steps.pr.outputs.head-ref }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
      run-id: ${{ steps.pr.outputs.run-id }}
      build-url: ${{ steps.pr.outputs.build-url }}
      failed-jobs: ${{ steps.pr.outputs.failed-jobs }}
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr-number }}
          CI_SYSTEM: ${{ inputs.ci-system }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          SKIP_PATTERN: ${{ inputs.skip-when-all-failures-match }}
          ATTEMPT_LABEL: ${{ inputs.attempt-label }}
          EXPECTED_AUTHOR: ${{ inputs.renovate-author }}
          EXPECTED_BASE: ${{ inputs.base-branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # A JSON array, so it comes through the environment, not interpolation.
          RUN_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
          # The status event, for jenkins mode. Empty on every other trigger.
          STATUS_STATE: ${{ github.event.state }}
          STATUS_CONTEXT: ${{ github.event.context }}
          STATUS_SHA: ${{ github.event.sha }}
          STATUS_TARGET_URL: ${{ github.event.target_url }}
          # Also a JSON array, for the same reason as RUN_PRS.
          STATUS_BRANCHES: ${{ toJson(github.event.branches) }}
          JENKINS_URL: ${{ inputs.jenkins-url }}
          JENKINS_CONTEXT: ${{ inputs.jenkins-status-context }}
          INPUT_BUILD_URL: ${{ inputs.jenkins-build-url }}
          JENKINS_USER: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          set -euo pipefail

          case "$CI_SYSTEM" in
            github-actions | jenkins) ;;
            # Anything else would quietly take the github-actions path and look for a
            # workflow run that does not exist.
            *) echo "::error::ci-system must be 'github-actions' or 'jenkins', not '$CI_SYSTEM'"
               exit 1 ;;
          esac

          run_id=""
          build_url=""
          build_result=""
          failed_jobs='[]'

          if [ "$CI_SYSTEM" = "jenkins" ]; then
            if [ -n "$INPUT_PR" ]; then
              number="$INPUT_PR"
              lookup="PR #$INPUT_PR"
            else
              number=""
              lookup="commit ${STATUS_SHA:-none}"
              # The status event fires for every commit status on every commit in the
              # repository, so nothing is looked up at all unless this one is the
              # configured context reporting a failed build. Jenkins maps a FAILURE
              # result onto the 'error' state and an UNSTABLE one onto 'failure', so
              # both of those count — verified against build.hmcts.net. The gate below
              # still decides; this only keeps the lookups off events that can never
              # be eligible.
              if { [ "$STATUS_STATE" = "failure" ] || [ "$STATUS_STATE" = "error" ]; } \
                && [ "$STATUS_CONTEXT" = "$JENKINS_CONTEXT" ]; then
                # The status payload has no pull_requests array, only the head SHA, so
                # the PR comes from the commit. A SHA can belong to more than one PR —
                # only open ones targeting the base branch are considered, and the
                # newest of those is taken.
                number=$(gh api "repos/${GH_REPO}/commits/${STATUS_SHA}/pulls" \
                  | jq -r --arg b "$EXPECTED_BASE" \
                    'first(.[] | select(.state == "open" and .base.ref == $b) | .number) // empty') \
                  || number=""
                # Branch fallback, for the same reason the workflow_run path has one:
                # that association is indexed and comes back empty often enough to need
                # a second route. `branches` holds every branch whose head is this
                # commit, so each is tried until one has an open PR.
                if [ -z "$number" ]; then
                  while read -r branch; do
                    [ -n "$branch" ] || continue
                    number=$(gh pr list --state open --head "$branch" \
                      --base "$EXPECTED_BASE" --limit 1 --json number \
                      --jq 'first(.[].number) // empty')
                    if [ -n "$number" ]; then break; fi
                  done <<<"$(jq -r 'if type == "array" then .[].name else empty end' \
                    <<<"${STATUS_BRANCHES:-null}")"
                fi
              else
                echo "status '$STATUS_CONTEXT' is '$STATUS_STATE', not a $JENKINS_CONTEXT failure"
              fi
            fi
          elif [ -n "$INPUT_PR" ]; then
            number="$INPUT_PR"
            lookup="branch '${RUN_BRANCH:-}'"
            # No triggering run — the failed one is looked up below, once the branch
            # is known.
            run_id=""
          else
            lookup="branch '${RUN_BRANCH:-}'"
            # pull_requests is empty often enough that the branch lookup below has to
            # be there as a fallback.
            # Guarded on type: the payload is absent, and toJson renders null, whenever
            # the caller was not triggered by workflow_run.
            number=$(jq -r 'if type == "array" then (first(.[].number) // empty) else empty end' \
              <<<"${RUN_PRS:-null}")
            if [ -z "$number" ] && [ -n "${RUN_BRANCH:-}" ]; then
              number=$(gh pr list --state open --head "$RUN_BRANCH" --limit 1 \
                --json number --jq 'first(.[].number) // empty')
            fi
            run_id="${RUN_ID:-}"
          fi

          if [ -z "$number" ]; then
            echo "no open PR found for $lookup — nothing to do"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr view "$number" \
            --json number,headRefName,headRefOid,isCrossRepository,state,baseRefName,labels \
            > /tmp/pr.json
          cat /tmp/pr.json

          head_ref=$(jq -r .headRefName /tmp/pr.json)

          # REST, not gh pr view --json author: the GraphQL-backed field renders an App
          # author as 'app/renovate', so a 'renovate[bot]' comparison never matches.
          author=$(gh api "repos/${GH_REPO}/pulls/${number}" --jq .user.login)
          echo "author: $author"

          if [ "$CI_SYSTEM" = "jenkins" ]; then
            # The handle on a Jenkins failure is the build URL. The status event carries
            # it as target_url; a manual run has no event, so the caller passes it.
            build_url="${STATUS_TARGET_URL:-}"
            if [ -n "$INPUT_PR" ]; then
              build_url="$INPUT_BUILD_URL"
            fi

            # target_url is the build URL with /display/redirect on the end. That is
            # stripped rather than followed: where the redirect lands depends on which
            # UI plugins the controller has, and curl's effective URL carries the
            # credentials, so following it risks putting them in the log.
            build_url="${build_url%%[?#]*}"
            build_url="${build_url%/}"
            build_url="${build_url%/display/redirect}"
            build_url="${build_url%/}"

            jenkins_root="${JENKINS_URL%/}"
            case "$build_url" in
              '') echo "no Jenkins build URL on the event, and jenkins-build-url is unset" ;;
              "$jenkins_root"/*) ;;
              *)
                # Anyone who can write a commit status chooses its target_url, so the
                # credentials only ever go to the configured controller.
                echo "build URL '${build_url}' is not under ${jenkins_root} — not fetching it"
                build_url=''
                ;;
            esac

            # Only Renovate's PRs reach the controller. A build this workflow would
            # decline anyway is not worth a Jenkins call, and a credentials problem
            # should not turn every human PR's failure red. Missing credentials are
            # left to the gate as well, so a repository that selects jenkins mode
            # without them is declined rather than failed. Eligibility is still the
            # gate's to decide, below.
            if [ -n "$build_url" ] && [ "$author" = "$EXPECTED_AUTHOR" ] \
              && [ -n "$JENKINS_USER" ] && [ -n "$JENKINS_TOKEN" ]; then
              # The token goes in a 0600 config file rather than on the command line,
              # where it would be visible to anything reading the process list.
              conf=$(mktemp)
              chmod 600 "$conf"
              trap 'rm -f "$conf"' EXIT
              printf 'user = "%s:%s"\n' "$JENKINS_USER" "$JENKINS_TOKEN" > "$conf"

              # Proving the controller is reachable and the credentials work here, in
              # the eligibility job, means an unreachable or unauthenticated Jenkins
              # fails before the attempt is claimed, so it costs nothing and the run
              # can simply be retried. 000 is curl's code for a connection that never
              # happened, which is what a runner outside the HMCTS network gets.
              code=$(curl -sS --config "$conf" -o /tmp/jenkins-build.json \
                -w '%{http_code}' --max-time 30 --retry 2 \
                "${build_url}/api/json?tree=result,building") || code='000'
              if [ "$code" != "200" ]; then
                echo "::error::could not read ${build_url} from Jenkins (HTTP ${code}) — check JENKINS_USERNAME and JENKINS_API_TOKEN, and that this runner can reach ${jenkins_root}"
                exit 1
              fi
              build_result=$(jq -r '.result // empty' /tmp/jenkins-build.json)
              echo "Jenkins build result: ${build_result:-none}"

              # Stage names are the Jenkins equivalent of GitHub Actions job names, so
              # both skip-when-all-failures-match and what Claude is told read from
              # them. wfapi belongs to the Pipeline: Stage View plugin; a controller or
              # a job type without it answers 404, which leaves the list empty.
              if curl -sS --config "$conf" -f -o /tmp/jenkins-stages.json \
                --max-time 30 "${build_url}/wfapi/describe"; then
                failed_jobs=$(jq -c \
                  '[.stages[]? | select(.status == "FAILED" or .status == "UNSTABLE") | .name]' \
                  /tmp/jenkins-stages.json)
              elif [ -n "$SKIP_PATTERN" ]; then
                echo "::warning::no stage list at ${build_url}/wfapi/describe, so skip-when-all-failures-match has nothing to match and the build will be attempted"
              fi

              rm -f "$conf"
            fi
          elif [ -z "$run_id" ] && [ -n "$CI_WORKFLOW" ]; then
            run_id=$(gh run list --workflow "$CI_WORKFLOW" --branch "$head_ref" \
              --status failure --limit 1 --json databaseId \
              --jq 'first(.[].databaseId) // empty')
            echo "latest failed $CI_WORKFLOW run for $head_ref: ${run_id:-none}"
          fi

          # Which jobs failed decides both eligibility below and what Claude is told.
          if [ "$CI_SYSTEM" = "github-actions" ] && [ -n "$run_id" ]; then
            failed_jobs=$(gh run view "$run_id" --json jobs \
              --jq '[.jobs[] | select(.conclusion == "failure") | .name]')
          fi
          echo "failed jobs: $failed_jobs"

          skip=false
          if [ -n "$SKIP_PATTERN" ]; then
            total=$(jq 'length' <<<"$failed_jobs")
            matched=$(jq --arg p "$SKIP_PATTERN" \
              '[.[] | select(test($p))] | length' <<<"$failed_jobs")
            # Only when something failed and all of it matched. A run reporting no
            # failed jobs is not a match, and is left to the gate below.
            if [ "$total" -gt 0 ] && [ "$total" = "$matched" ]; then
              skip=true
            fi
          fi

          {
            echo "found=true"
            echo "number=$number"
            echo "head-ref=$head_ref"
            echo "head-sha=$(jq -r .headRefOid /tmp/pr.json)"
            echo "run-id=$run_id"
            echo "build-url=$build_url"
            echo "build-result=$build_result"
            echo "author=$author"
            echo "state=$(jq -r .state /tmp/pr.json)"
            echo "base=$(jq -r .baseRefName /tmp/pr.json)"
            echo "fork=$(jq -r .isCrossRepository /tmp/pr.json)"
            echo "labelled=$(jq -r --arg l "$ATTEMPT_LABEL" '[.labels[].name] | contains([$l])' /tmp/pr.json)"
            echo "failed-jobs=$(jq -r 'join(", ")' <<<"$failed_jobs")"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to attempt a fix
        id: gate
        env:
          FOUND: ${{ steps.pr.outputs.found }}
          MANUAL: ${{ inputs.pr-number }}
          CI_SYSTEM: ${{ inputs.ci-system }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATUS_STATE: ${{ github.event.state }}
          STATUS_CONTEXT: ${{ github.event.context }}
          STATUS_SHA: ${{ github.event.sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BUILD_URL: ${{ steps.pr.outputs.build-url }}
          BUILD_RESULT: ${{ steps.pr.outputs.build-result }}
          JENKINS_URL: ${{ inputs.jenkins-url }}
          JENKINS_CONTEXT: ${{ inputs.jenkins-status-context }}
          # The secrets themselves are not needed here, only whether they are set.
          JENKINS_CREDS_SET: ${{ secrets.JENKINS_USERNAME != '' && secrets.JENKINS_API_TOKEN != '' }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          EXPECTED_AUTHOR: ${{ inputs.renovate-author }}
          STATE: ${{ steps.pr.outputs.state }}
          BASE: ${{ steps.pr.outputs.base }}
          EXPECTED_BASE: ${{ inputs.base-branch }}
          IS_FORK: ${{ steps.pr.outputs.fork }}
          LABELLED: ${{ steps.pr.outputs.labelled }}
          ATTEMPT_LABEL: ${{ inputs.attempt-label }}
          RUN_ID: ${{ steps.pr.outputs.run-id }}
          SKIP: ${{ steps.pr.outputs.skip }}
          SKIP_PATTERN: ${{ inputs.skip-when-all-failures-match }}
        run: |
          set -euo pipefail

          # Single place that gates the autofix job, so the conditions cannot drift.
          eligible=true
          note() { eligible=false; echo "$1"; }

          # 'job' in github-actions mode, 'stage' in jenkins mode — the two things
          # skip-when-all-failures-match is matched against.
          unit=job

          [ "$FOUND" = "true" ] || note "no PR resolved"
          if [ "$CI_SYSTEM" = "jenkins" ]; then
            unit=stage
            # Jenkins maps a FAILURE result onto the 'error' state and an UNSTABLE one
            # onto 'failure', so both of those are a failed build.
            [ -n "$MANUAL" ] || [ "$STATUS_STATE" = "failure" ] || [ "$STATUS_STATE" = "error" ] \
              || note "the commit status is '$STATUS_STATE' — only failures are attempted"
            [ -n "$MANUAL" ] || [ "$STATUS_CONTEXT" = "$JENKINS_CONTEXT" ] \
              || note "the status context is '$STATUS_CONTEXT', not $JENKINS_CONTEXT"
            # The checkout, the fix and the lease are all against the PR head, so a
            # status for an older commit is diagnosing a build of code that is no
            # longer there.
            [ -n "$MANUAL" ] || [ "$STATUS_SHA" = "$HEAD_SHA" ] \
              || note "the status is for commit $STATUS_SHA but the PR head is $HEAD_SHA — the branch has moved on"
          else
            [ -n "$CI_WORKFLOW" ] || note "ci-workflow is required when ci-system is github-actions"
            [ -n "$MANUAL" ] || [ "$CONCLUSION" = "failure" ] \
              || note "the triggering run concluded '$CONCLUSION' — only failures are attempted"
          fi
          [ "$AUTHOR" = "$EXPECTED_AUTHOR" ] || note "PR author is '$AUTHOR', not $EXPECTED_AUTHOR"
          [ "$STATE" = "OPEN" ] || note "PR is $STATE"
          [ "$BASE" = "$EXPECTED_BASE" ] || note "PR targets '$BASE', not $EXPECTED_BASE"
          [ "$IS_FORK" != "true" ] || note "PR is from a fork — the app token cannot push to fork heads"
          [ "$LABELLED" != "true" ] || note "already attempted ($ATTEMPT_LABEL present) — not retrying"
          if [ "$CI_SYSTEM" = "jenkins" ]; then
            [ "$JENKINS_CREDS_SET" = "true" ] \
              || note "JENKINS_USERNAME and JENKINS_API_TOKEN are not both set — the console log cannot be read"
            [ -n "$BUILD_URL" ] || note "no Jenkins build under $JENKINS_URL to diagnose"
            # ABORTED and NOT_BUILT arrive as 'error' too. A build Jenkins superseded or
            # timed out is not a failure a code change can fix, and attempting it would
            # spend the one attempt this PR gets.
            case "$BUILD_RESULT" in
              FAILURE | UNSTABLE) ;;
              *) note "the Jenkins build result is '${BUILD_RESULT:-none}' — only FAILURE and UNSTABLE are attempted" ;;
            esac
          else
            [ -n "$RUN_ID" ] || note "no failed run found to diagnose"
          fi
          [ "$SKIP" != "true" ] \
            || note "every failed $unit matches '$SKIP_PATTERN' — no code change can fix this"

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          [ "$eligible" = "true" ] && echo "eligible — handing PR #${{ steps.pr.outputs.number }} to Claude" || true

      - name: Generate GitHub App Token
        id: app-token
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_PRIVATE_KEY }}
          permission-issues: write

      - name: Claim the attempt
        # In this job rather than the next, so the gate above and the claim are one
        # serialised region. Claimed before the agent runs, so a crash or a timeout
        # still consumes the attempt instead of looping.
        #
        # The App token, not GITHUB_TOKEN: the latter is refused on the labels endpoint
        # with "Resource not accessible by integration" even when the caller grants
        # issues: write.
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          PR: ${{ steps.pr.outputs.number }}
          ATTEMPT_LABEL: ${{ inputs.attempt-label }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: Number(process.env.PR),
              labels: [process.env.ATTEMPT_LABEL],
            });
            core.info(`PR #${process.env.PR}: claimed — no further automatic attempts`);

  autofix:
    name: Autofix PR #${{ needs.resolve.outputs.number }}
    needs: [resolve]
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ${{ inputs.runs-on }}
    concurrency:
      # Not cancel-in-progress: a second failure must not kill an attempt midway
      # through. Eligibility and the claim are serialised in the resolve job, so a
      # second failure is refused there rather than reaching this job.
      group: renovate-autofix-${{ github.repository }}-pr-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write # comments on the PR
      actions: read # read the failed run's logs
      id-token: write # Bedrock OIDC
    outputs:
      outcome: ${{ steps.outcome.outputs.state }}
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      PR: ${{ needs.resolve.outputs.number }}
      HEAD_REF: ${{ needs.resolve.outputs.head-ref }}
      HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_PRIVATE_KEY }}
          # Scoped down from every permission the App has — Claude runs unattended
          # with this token in reach. Actions is needed to read the failed run's logs,
          # which a public repository grants any authenticated token but a private one
          # does not.
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          # By SHA, not branch name — the push below leases against this exact commit.
          ref: ${{ needs.resolve.outputs.head-sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          # Otherwise the token lands in .git/config, where Claude could read it. The
          # push below puts it on the remote URL for that one command instead.
          persist-credentials: false

      - name: Configure Git
        env:
          AUTHOR_NAME: ${{ inputs.commit-author-name }}
          AUTHOR_EMAIL: ${{ inputs.commit-author-email }}
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git checkout -B "$HEAD_REF"

      - name: Collect the failure
        id: failure
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          CI_SYSTEM: ${{ inputs.ci-system }}
          RUN_ID: ${{ needs.resolve.outputs.run-id }}
          BUILD_URL: ${{ needs.resolve.outputs.build-url }}
          FAILED_JOBS: ${{ needs.resolve.outputs.failed-jobs }}
          JENKINS_USER: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$CI_SYSTEM" = "jenkins" ]; then
            # Same config-file handling as the eligibility job, and removed as soon as
            # the log is down: the agent runs in this workspace with Read in its tool
            # list, so the token must not still be on disk when it starts.
            conf=$(mktemp)
            chmod 600 "$conf"
            trap 'rm -f "$conf"' EXIT
            printf 'user = "%s:%s"\n' "$JENKINS_USER" "$JENKINS_TOKEN" > "$conf"

            # Stop the run rather than degrade, as below. Reachability and the
            # credentials were already proved in the eligibility job, before the
            # attempt was claimed, so getting here and failing means the fetch itself
            # went wrong rather than the configuration being wrong.
            if ! curl -sS --config "$conf" -f -o /tmp/ci-failure.raw \
              --max-time 300 --retry 2 "${BUILD_URL}/consoleText"; then
              echo "::error::could not read the console log at ${BUILD_URL}/consoleText"
              exit 1
            fi
            rm -f "$conf"

            {
              echo 'failed<<CONTEXT'
              echo "JENKINS BUILD: ${BUILD_URL}"
              echo "FAILED STAGES: ${FAILED_JOBS}"
              echo 'CONTEXT'
              echo "log-description=the tail of the Jenkins console log"
            } >> "$GITHUB_OUTPUT"
          else
            # Stop the run rather than degrade: the agent is told to diagnose from this
            # file, and an unreadable log leaves it guessing. This step runs before the
            # attempt is claimed, so failing here costs nothing and can be retried.
            if ! gh run view "$RUN_ID" --log-failed > /tmp/ci-failure.raw; then
              echo "::error::could not read the logs for run ${RUN_ID} — the App token needs Actions: read"
              exit 1
            fi

            {
              echo 'failed<<CONTEXT'
              echo "FAILED JOBS: ${FAILED_JOBS}"
              echo 'CONTEXT'
              echo "log-description=the tail of the failed jobs' logs"
            } >> "$GITHUB_OUTPUT"
          fi

          # Keep the tail — the assertion or stack trace is at the end of the log, and
          # a Jenkins console log of a full pipeline runs to hundreds of kilobytes.
          tail -c 200000 /tmp/ci-failure.raw > /tmp/ci-failure.log
          if [ ! -s /tmp/ci-failure.log ]; then
            echo "::warning::the failed run reported no job logs, so there is nothing to diagnose from"
          fi
          wc -l /tmp/ci-failure.log

          # Which dependency this PR updates, so Claude can tell breakage caused by
          # the bump from breakage that is unrelated to it.
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        if: inputs.enable-corepack
        run: corepack enable

      - name: Setup Node.js
        if: inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      # Dependency installation is deliberately NOT a step. The update under diagnosis
      # is often what breaks install, and a step can only report that secondhand — run
      # by Claude, the error is in its own terminal, where it can read it and act on it.
      # Tell it what to run in the prompt input.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}

      - name: Run Claude Code - Autofix
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.opus-model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.sonnet-model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.haiku-model }}
        with:
          use_bedrock: "true"
          github_token: ${{ steps.app-token.outputs.token }}
          # The triggering actor is the bot that opened the PR, and the action refuses
          # non-human actors by default. Only that one is listed — not '*' — so the
          # prompt stays the only thing that can drive this job.
          allowed_bots: ${{ inputs.allowed-bots }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ env.PR }}
            BRANCH: ${{ env.HEAD_REF }}
            UPDATE: ${{ steps.failure.outputs.subject }}
            ${{ steps.failure.outputs.failed }}

            Read /tmp/ci-failure.log first — it is ${{ steps.failure.outputs.log-description }}.
            Diagnose from it before changing anything.

            ${{ inputs.prompt }}
          claude_args: |
            --dangerously-skip-permissions
            --max-turns ${{ inputs.max-turns }}
            --append-system-prompt "You are fixing a failing dependency-update PR in a GitHub Action with no human present. Do not ask questions — nobody can answer; stop and write the report instead. Never push, never use --force, never revert the dependency update. Changing nothing is preferable to guessing. Always write /tmp/autofix-report.md."
            --allowedTools "${{ inputs.allowed-tools }}${{ inputs.extra-allowed-tools && ',' || '' }}${{ inputs.extra-allowed-tools }}"

      - name: Determine outcome
        id: outcome
        if: always()
        run: |
          set -euo pipefail

          # Trust git, not the model's self-report.
          # Untracked files are excluded: install, build and test all run in this tree
          # and leave residue that is not the agent's work, which would otherwise read
          # as an unfinished fix.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            # Uncommitted changes mean it stopped partway — pushing would ship half
            # a fix.
            state=dirty
            git status --short
          elif [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            state=no-change
          elif ! git merge-base --is-ancestor "$HEAD_SHA" HEAD; then
            # HEAD moved, but not forward: an amend, a rebase or a reset. The lease
            # still matches the remote, so a push would succeed and silently drop the
            # update the PR exists to make.
            state=rewritten
            git log --oneline -3
          else
            state=fixed
            git log --oneline "$HEAD_SHA"..HEAD
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Outcome: $state"

      - name: Push the fix
        id: push
        # always(), because a commit made before the agent hit a timeout, a throttle or
        # its turn limit is still a valid fix. Without it the implicit success() drops
        # that commit and the run reports a push that was never attempted.
        if: ${{ always() && steps.outcome.outputs.state == 'fixed' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Leased against the checked-out SHA, so a branch the bot refreshed mid-run
          # is refused rather than clobbered. The explicit <ref>:<oid> form matters —
          # the bare form leases against the local remote-tracking ref and silently
          # degrades to a plain --force after any fetch.
          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${HEAD_REF}"

          # Read by the report step, which must not claim success on a rejected push.
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Report on PR
        if: always()
        uses: actions/github-script@v9
        env:
          STATE: ${{ steps.outcome.outputs.state }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          FAILED_JOBS: ${{ needs.resolve.outputs.failed-jobs }}
          BUILD_URL: ${{ needs.resolve.outputs.build-url }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          ATTEMPT_LABEL: ${{ inputs.attempt-label }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- renovate-autofix -->';
            const { owner, repo } = context.repo;
            const pr = Number(process.env.PR);
            const state = process.env.STATE;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Only set in jenkins mode, where the run link above is this workflow and
            // not the build that failed.
            const buildUrl = process.env.BUILD_URL;

            // Report on the push, not the fix: a lease rejection leaves the branch
            // exactly as it was and must not read as success.
            const pushed = process.env.PUSHED === 'true';
            // Distinguishes a lease the remote refused from a push that never ran,
            // which read identically when only `pushed` was consulted.
            const pushRejected = state === 'fixed' && !pushed
              && process.env.PUSH_OUTCOME === 'failure';

            let report = '';
            try { report = fs.readFileSync('/tmp/autofix-report.md', 'utf8').trim(); }
            catch { report = '_No report was produced._'; }

            // A throttle, timeout or max-turns stop also leaves the tree at
            // no-change, which must not read as a considered decision.
            const crashed = process.env.CLAUDE_OUTCOME !== 'success';

            const heading = pushed
              ? '## 🤖 Autofix pushed'
              : state === 'rewritten'
                ? '## ⚠️ Autofix rewrote history and was not pushed'
                : crashed
                  ? '## ⚠️ Autofix did not complete'
                  : state === 'no-change'
                    ? '## 🤖 Autofix made no changes'
                    : state === 'fixed'
                      ? '## ⚠️ Autofix produced a fix but could not push it'
                      : '## ⚠️ Autofix stopped partway';

            const why = pushRejected
              ? '\nThe push was rejected — the branch moved while Claude was working, so it has been left alone. Its head no longer matches what was fixed.'
              : state === 'rewritten'
                ? '\nThe commit history was rewritten rather than added to, so the head is not a descendant of what was reviewed. Pushing would have discarded the update this PR makes, so nothing was pushed.'
                : null;

            const footer = [
              // Only when a commit landed — otherwise the PR is still the bot's.
              pushed
                ? 'ℹ️ **This PR now needs manual review and merge.** It carries a commit that is not Renovate\'s, so Renovate will no longer rebase, update or automerge it.'
                : null,
              `_Autofix runs once per PR. Remove the \`${process.env.ATTEMPT_LABEL}\` label to allow one more attempt._`,
            ].filter(l => l !== null);

            const body = [
              MARKER,
              heading,
              '',
              `The pipeline failed${process.env.FAILED_JOBS ? ` in **${process.env.FAILED_JOBS}**` : ''}. [View the run](${runUrl}).${buildUrl ? ` [View the Jenkins build](${buildUrl}).` : ''}`,
              why,
              '',
              '---',
              '',
              report,
              // Suppress the rule when there is no footer to separate.
              ...(footer.length ? ['', '---', '', ...footer] : []),
            ].filter(l => l !== null).join('\n');

            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: pr, body });
            }

      - name: Fail on an incomplete attempt
        # A dirty tree or rejected push is worth a red run; no-change is a legitimate
        # outcome and stays green.
        if: ${{ always() && (steps.outcome.outputs.state == 'dirty' || steps.outcome.outputs.state == 'rewritten' || (steps.outcome.outputs.state == 'fixed' && steps.push.outputs.pushed != 'true')) }}
        run: |
          echo "::error::autofix did not complete cleanly (state=${{ steps.outcome.outputs.state }}, pushed=${{ steps.push.outputs.pushed || 'false' }})"
          exit 1
